<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚽ FOOTBALL LEGENDS</title>

<style>
:root{
  --bg:#050814;
  --panel:#0d1426;
  --panel2:#121d36;
  --line:#2a3d67;
  --text:#f2f6ff;
  --muted:#94a7c7;
  --gold:#ffd86b;
  --cyan:#5ee7ff;
  --violet:#8d6cff;
  --green:#55e39a;
  --red:#ff6f91;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(circle at 50% -10%,#1a2b55 0,#080d1b 42%,#03050c 100%);
  color:var(--text);
  font-family:Inter,system-ui,Arial,sans-serif;
  min-height:100vh
}
button,input,select{font:inherit}
button{
  border:1px solid #365487;
  background:#142442;
  color:#fff;
  padding:11px 15px;
  border-radius:12px;
  font-weight:900;
  cursor:pointer
}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.primary{
  background:linear-gradient(135deg,#20cfff,#705dff);
  border:0
}
.gold{
  background:linear-gradient(135deg,#f7b733,#fcf6ba);
  color:#241b05;
  border:0
}
.danger{background:#702d45}
.hidden{display:none!important}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#070b16f5;
  border-bottom:1px solid #23375e;
  padding:14px 4%
}
.top{
  max-width:1500px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:16px;
  justify-content:space-between;
  flex-wrap:wrap
}
.brand{
  font-size:24px;
  font-weight:1000;
  letter-spacing:1px
}
.wallet{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.pill{
  background:#0d1730;
  border:1px solid #29456f;
  border-radius:999px;
  padding:8px 12px;
  font-weight:800
}
.onlineDot{color:var(--green)}

main{
  max-width:1500px;
  margin:auto;
  padding:24px 4% 60px
}
.hero{
  min-height:260px;
  border:1px solid #2d4875;
  border-radius:28px;
  padding:25px;
  background:
    linear-gradient(135deg,#101d3a,#161032),
    radial-gradient(circle at 50% 80%,#3a55a855,transparent 45%);
  position:relative;
  overflow:hidden
}
.hero:after{
  content:"⚽";
  position:absolute;
  font-size:220px;
  right:6%;
  top:-30px;
  opacity:.05;
  transform:rotate(-15deg)
}
.profile{
  display:flex;
  gap:18px;
  align-items:center
}
.avatar{
  width:80px;
  height:80px;
  border-radius:22px;
  background:linear-gradient(135deg,#5ee7ff,#8d6cff);
  display:grid;
  place-items:center;
  font-size:38px;
  border:2px solid #fff5;
  flex:0 0 auto
}
.name{
  font-size:27px;
  font-weight:1000
}
.title{
  color:#ffd76c;
  font-weight:900
}
.xpbar{
  height:10px;
  background:#17233d;
  border-radius:99px;
  overflow:hidden;
  max-width:480px;
  margin-top:8px
}
.xpbar i{
  display:block;
  height:100%;
  width:0;
  background:linear-gradient(90deg,#55e39a,#5ee7ff)
}
.nav{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(125px,1fr));
  gap:10px;
  margin:18px 0 0
}
.nav button{min-height:53px}
.view{display:none}
.view.active{display:block}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin:22px 0 12px
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px
}
.panel{
  background:linear-gradient(160deg,#101a30,#0a1020);
  border:1px solid #263c64;
  border-radius:22px;
  padding:18px
}
.card{
  background:linear-gradient(155deg,#17264b,#0c1324);
  border:1px solid #3b5686;
  border-radius:24px;
  padding:12px;
  position:relative;
  overflow:hidden
}
.card.immortal{border-color:#ffcf4a}
.card.legend{border-color:#8d6cff}
.card.icon{border-color:#55e3ff}
.card.epic{border-color:#ba7bff}
.card.rare{border-color:#58b7ff}
.face{
  height:245px;
  border-radius:17px;
  background:linear-gradient(135deg,#38d5ff,#6848e8);
  position:relative;
  display:grid;
  place-items:center;
  overflow:hidden
}
.face:before{
  content:"⚽";
  width:110px;
  height:140px;
  background:linear-gradient(145deg,#1e2d48,#10192a);
  border-radius:45% 45% 25% 25%;
  display:grid;
  place-items:center;
  font-size:55px
}
.rating{
  position:absolute;
  left:15px;
  top:12px;
  font-size:34px;
  font-weight:1000
}
.pos{
  position:absolute;
  left:19px;
  top:54px;
  color:#dbe7ff;
  font-weight:900
}
.flag{
  position:absolute;
  right:15px;
  top:15px;
  font-size:22px
}
.club{
  position:absolute;
  bottom:13px;
  left:0;
  right:0;
  text-align:center;
  font-size:12px;
  font-weight:900
}
.rarity{
  position:absolute;
  right:12px;
  top:58px;
  padding:5px 8px;
  border-radius:8px;
  background:#050a16d9;
  font-size:11px;
  font-weight:1000
}
.card h3{margin:12px 0 4px}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  color:#c9d6ed;
  font-size:12px
}
.value{
  margin:11px 0;
  color:var(--gold);
  font-weight:1000
}
.small{
  font-size:12px;
  color:var(--muted)
}
.good{color:var(--green);font-weight:900}
.bad{color:var(--red);font-weight:900}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px
}
input,select{
  background:#081226;
  color:#fff;
  border:1px solid #385277;
  border-radius:10px;
  padding:11px
}
.table{
  width:100%;
  border-collapse:collapse
}
.table th,.table td{
  padding:11px;
  border-bottom:1px solid #223452;
  text-align:left
}
.pitch{
  min-height:580px;
  border-radius:28px;
  padding:30px;
  background:
    radial-gradient(ellipse at center,#17733b,#0c4d2a 55%,#082c1a);
  border:3px solid #58b77955;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden
}
.pitch:before{
  content:"";
  position:absolute;
  inset:8%;
  border:2px solid #ffffff33;
  border-radius:8px
}
.formation{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:38px;
  z-index:1;
  width:80%;
  max-width:650px
}
.slot{
  min-height:72px;
  border:1px dashed #ffffff66;
  border-radius:15px;
  background:#071522aa;
  display:grid;
  place-items:center;
  text-align:center;
  padding:7px
}
.quest{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  padding:14px;
  border:1px solid #263c64;
  border-radius:14px;
  margin:8px 0;
  background:#0c1528
}
.event{
  min-height:190px;
  border-radius:22px;
  padding:20px;
  background:linear-gradient(135deg,#331b4f,#0f2448);
  border:1px solid #6b56a1
}

.modal{
  position:fixed;
  inset:0;
  background:#000d;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:20px
}
.modal.show{display:flex}
.modalbox{
  width:min(1050px,96vw);
  max-height:92vh;
  overflow:auto;
  background:linear-gradient(160deg,#111d38,#080d18);
  border:1px solid #405f92;
  border-radius:28px;
  padding:25px
}
.packbox{
  text-align:center;
  min-height:400px
}
.pack{
  width:230px;
  height:300px;
  margin:20px auto;
  border-radius:25px;
  background:linear-gradient(145deg,#ffd85a,#8d5cff 55%,#25d8ff);
  display:grid;
  place-items:center;
  font-size:32px;
  font-weight:1000
}
.pack.open{transform:scale(1.08) rotateY(360deg)}
.resultgrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
  margin-top:20px;
  text-align:left
}

#authScreen{
  position:fixed;
  inset:0;
  z-index:9999;
  background:
    radial-gradient(circle at 50% 0%,#1b3265,#050814 55%,#02030a);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.authbox{
  width:min(520px,95vw);
  background:#0b1326;
  border:1px solid #3d5d93;
  border-radius:28px;
  padding:28px;
  box-shadow:0 30px 100px #000
}
.authbox h1{
  text-align:center;
  margin-top:0
}
.authtabs{
  display:flex;
  gap:8px;
  margin-bottom:12px
}
.authtabs button{flex:1}
.authbox input{
  width:100%;
  margin:7px 0
}
.authmsg{
  min-height:25px;
  color:#ffd86b;
  font-weight:800;
  margin-top:7px
}

#adminPanel{
  position:fixed;
  inset:0;
  z-index:9998;
  background:#02050df2;
  display:none;
  overflow:auto;
  padding:25px
}
.adminbox{
  max-width:1250px;
  margin:auto;
  background:#0b1326;
  border:1px solid #4f69a1;
  border-radius:26px;
  padding:24px
}
.adminnav{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.adminlog{
  background:#050914;
  border:1px solid #253b64;
  border-radius:14px;
  padding:12px;
  min-height:100px;
  white-space:pre-wrap;
  max-height:280px;
  overflow:auto
}
.pricebox{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:10px
}
.logout{
  float:right
}
.accountBadge{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:100;
  background:#0c1730;
  border:1px solid #35558b;
  border-radius:14px;
  padding:10px 14px;
  font-size:12px
}
.profile-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px
}
.avatarChoices{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px
}
.avatarChoices button{
  font-size:24px;
  min-width:50px
}
.searchResult{
  margin-top:14px
}
.friendCard{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:12px;
  align-items:center
}
.friendAvatar{
  width:54px;
  height:54px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#5ee7ff,#8d6cff);
  font-size:25px
}
.statusBox{
  border:1px solid #29456f;
  background:#081226;
  border-radius:14px;
  padding:12px;
  margin:10px 0
}

html.light-performance *{
  animation:none!important;
  transition:none!important;
  scroll-behavior:auto!important
}
html.light-performance .panel,
html.light-performance .card,
html.light-performance .hero,
html.light-performance .adminbox,
html.light-performance .authbox{
  box-shadow:none!important
}
html.light-performance .hero:after{display:none!important}

@media(max-width:700px){
  .name{font-size:21px}
  .hero{padding:18px}
  .formation{width:95%;gap:18px}
  .pitch{min-height:500px}
  .table{font-size:13px}
}
</style>
</head>
